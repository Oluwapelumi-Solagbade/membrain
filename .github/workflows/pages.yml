# Publishes the site to GitHub Pages, connected to the live MemBrain server on Hugging Face (same data and AI):
# https://teamcerebrospark.github.io/membrain/
# One-time setup by the repo owner: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Site on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the static site under /<repo>
        working-directory: site
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # The Pages copy is a second front door to the SAME live server (saving, Gulf Whisper, MedGemma); the server
          # allows this origin (ALLOWED_ORIGINS). If the server is unreachable, the page says so and runs in the browser.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || vars.API_URL || 'https://vulcan-spark-membrain.hf.space' }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
