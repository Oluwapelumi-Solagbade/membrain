<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemBrain — voice-first brain health check-in (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1d2a2e; --muted:#5f6b6e; --line:#e3ded3;
  --teal:#0f5c63; --teal-2:#1b7b84; --teal-soft:#e2efef; --sand:#c89b5a; --sand-soft:#f5ead9;
  --stable:#2f7d4f; --stable-soft:#e3f1e8; --check:#a8661b; --check-soft:#fbefdc;
  --review:#b2462e; --review-soft:#f8e3dd; --urgent:#8f1d3b; --urgent-soft:#f6dde4; --base:#4d5f8a; --base-soft:#e5e9f3;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,30,.06),0 4px 16px rgba(20,30,30,.05);
  --fs:16px;
}
.hc{--bg:#fff;--panel:#fff;--ink:#000;--muted:#222;--line:#000;--teal:#003d42;--teal-soft:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.5 Inter,"IBM Plex Sans Arabic",system-ui,sans-serif}
[dir=rtl] body,[dir=rtl] .ar{font-family:"IBM Plex Sans Arabic",Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
a{color:var(--teal)}
header.top{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;color:var(--teal)}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
nav.tabs{display:flex;gap:4px;background:#ebe7de;padding:4px;border-radius:999px}
nav.tabs button{border:0;background:transparent;padding:7px 11px;border-radius:999px;color:var(--muted);font-weight:500;font-size:13.5px}
nav.tabs button.on{background:var(--panel);color:var(--teal);box-shadow:var(--shadow)}
@media (max-width:760px){nav.tabs{max-width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none} nav.tabs button{white-space:nowrap;flex:0 0 auto}}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.lv-BASELINE{background:var(--base-soft);color:var(--base)} .lv-STABLE{background:var(--stable-soft);color:var(--stable)}
.lv-CHECK_AGAIN{background:var(--check-soft);color:var(--check)} .lv-CLINICIAN_REVIEW{background:var(--review-soft);color:var(--review)}
.lv-URGENT{background:var(--urgent-soft);color:var(--urgent)} .lv-INVALID{background:#eee;color:#555}
.banner{background:var(--sand-soft);border-bottom:1px solid #ecdcc0;color:#6b4e22;font-size:13px;text-align:center;padding:6px 12px}
main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px 20px}
h1,h2,h3{margin:0 0 8px;line-height:1.25}
h2{font-size:20px} h3{font-size:15.5px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.grid{display:grid;gap:16px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--teal-2)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-2)}
.btn.ghost{background:transparent}
.btn.big{font-size:1.15em;padding:14px 22px;border-radius:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0;background:#fbfaf7}
.chip.on{background:var(--teal-soft);border-color:#bcd9da;color:var(--teal)}
.chip.off{color:#999;text-decoration:line-through}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .ci{font-size:11.5px;color:var(--muted)}
/* participant */
.pt-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.phone{max-width:560px;width:100%;margin:0 auto;min-height:620px;display:flex;flex-direction:column}
.phone .bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.phone .body{padding:26px 26px;flex:1;display:flex;flex-direction:column;gap:18px}
.phone .foot{padding:14px 16px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between}
.progress{height:6px;background:#eee8dc;border-radius:99px;overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--teal);transition:width .4s}
.say{font-size:1.45em;font-weight:600;line-height:1.35}
.mic{width:120px;height:120px;border-radius:50%;border:0;background:var(--teal);color:#fff;display:grid;place-items:center;margin:6px auto;box-shadow:0 6px 24px rgba(15,92,99,.35);font-size:15px;font-weight:600}
.mic.rec{background:#b2462e;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(178,70,46,.45)}70%{box-shadow:0 0 0 22px rgba(178,70,46,0)}100%{box-shadow:0 0 0 0 rgba(178,70,46,0)}}
.meter{height:10px;border-radius:99px;background:#eee8dc;overflow:hidden} .meter i{display:block;height:100%;background:var(--sand);width:0}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:#fdfcfa}
.opts{display:grid;gap:10px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;background:#fff;text-align:start;font-size:1.05em;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:background .15s ease,border-color .15s ease,transform .1s ease}
.opt:hover{border-color:var(--teal);background:#fbfdfc}
.opt:active{transform:scale(0.985);background:var(--teal-soft)}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.timer{font-size:42px;font-weight:700;text-align:center;color:var(--teal);font-variant-numeric:tabular-nums}
.wordshow{font-size:2.1em;font-weight:700;text-align:center;color:var(--teal);min-height:1.5em}
.result-card{border-radius:14px;padding:18px}
.side h3{margin-top:4px}
/* clinician */
.cl-wrap{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
.qitem{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;gap:4px}
.qitem:hover{background:#faf8f3} .qitem.sel{background:var(--teal-soft)}
.qitem .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.alertbox{border-radius:12px;padding:14px 16px;border:1px solid}
.alertbox.lv-URGENT{border-color:#e8b9c6} .alertbox.lv-CLINICIAN_REVIEW{border-color:#efc2b6} .alertbox.lv-CHECK_AGAIN{border-color:#f0d4a8}
.alertbox.lv-STABLE{border-color:#bfdcc9} .alertbox.lv-BASELINE{border-color:#c9d1e4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.check{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13.5px}
.check b{min-width:18px}
.bar-rci{position:relative;height:8px;background:#efebe2;border-radius:99px;width:120px;display:inline-block;vertical-align:middle}
.bar-rci i{position:absolute;top:0;height:100%;border-radius:99px}
.bar-rci .zero{position:absolute;left:50%;top:-3px;width:1px;height:14px;background:#999}
.modal{position:fixed;inset:0;background:rgba(20,30,30,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal.on{display:flex}
.modal .panel{max-width:860px;width:100%}
pre.code{background:#0f1f22;color:#d8efe9;padding:14px;border-radius:10px;overflow:auto;max-height:420px;font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;font-size:13px}
.seg button.on{background:var(--teal);color:#fff}
.req{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.req .n{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:980px){.pt-wrap,.cl-wrap,.two,.enrol{grid-template-columns:1fr !important}}
@media print{header.top,.banner,.noprint{display:none}}
</style>
</head>
<body>
<div class="banner" id="banner">Prototype for the Future Health Digital Innovation Challenge. All people and data are synthetic. MemBrain identifies risk and change; it does not diagnose.</div>
<header class="top"><div class="top-in">
  <div class="brand"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#0f5c63"/><path d="M8 18c2-6 5-6 8 0s6 6 8 0" stroke="#f5ead9" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="16" cy="10" r="2.2" fill="#c89b5a"/></svg>
    <div>MemBrain<small>Cerebro Spark · brain health check-in</small></div></div>
  <nav class="tabs" id="tabs" role="tablist">
    <button data-view="home" class="on">Start</button>
    <button data-view="intake">Raise a concern</button>
    <button data-view="participant">Check-in</button>
    <button data-view="clinician">Clinician dashboard</button>
    <button data-view="referrals">Referrals</button>
    <button data-view="validation">Validation</button>
    <button data-view="how">How it works</button>
  </nav>
  <div class="spacer"></div>
  <span class="tiny muted" id="ver" style="max-width:190px;text-align:right"></span>
</div></header>
<main id="main"></main>
<div class="modal" id="modal"><div class="panel pad" id="modal-body"></div></div>
<div class="toast" id="toast"></div>
<script>

 "NORMS_VERSION": "synthetic-2026.11", "PHQ2_CUTOFF": 3, "PRACTICE_SATURATION": 3, "RAPID_DROP_Z": 1.5, "RCI_CHECK": -1.645, "RCI_DOMAIN_CHECK": -1.96, "RCI_LARGE": -2.576, "RED_FLAGS": {"sudden_onset": "Change started suddenly, over hours or days", "fluctuating_confusion": "Confusion or attention comes and goes during the day", "new_neuro_symptoms": "New weakness, facial droop, speech difficulty or severe headache", "recent_fall_head_injury": "Recent fall or head injury", "rapid_deterioration": "Rapid worsening over weeks", "safety_risk": "Immediate safety risk (wandering, unsafe at home, self-neglect)"}, "REPEAT_WEEKS": [2, 4], "REPORTER_LABEL": {"self": "the participant", "family": "a family member", "helper": "a household helper", "professional": "a healthcare professional", "coordinator": "a programme coordinator"}, "REQUIRE_CONFIRMATION": true, "REVIEW_TARGET_DAYS": {"CLINICIAN_REVIEW": 21, "URGENT": 3}, "ROUTINE_MONTHS": 6, "SLEEP_HOURS_LOW": 5.5, "TRIGGER_DOMAINS": ["memory_delayed"]}, "items": {"WORD_LISTS": {"A": {"en": ["camel", "window", "orange", "teacher", "river", "coffee", "boat", "garden", "doctor", "moon"], "ar": ["جمل", "شباك", "برتقال", "معلم", "نهر", "قهوة", "قارب", "حديقة", "طبيب", "قمر"]}, "B": {"en": ["horse", "door", "lemon", "farmer", "sea", "bread", "car", "market", "nurse", "star"], "ar": ["حصان", "باب", "ليمون", "مزارع", "بحر", "خبز", "سيارة", "سوق", "ممرضة", "نجمة"]}, "C": {"en": ["goat", "chair", "grape", "driver", "desert", "tea", "plane", "mosque", "baker", "sun"], "ar": ["ماعز", "كرسي", "عنب", "سائق", "صحراء", "شاي", "طائرة", "مسجد", "خباز", "شمس"]}}, "FLUENCY": {"A": {"category": {"en": "animals", "ar": "الحيوانات"}}, "B": {"category": {"en": "fruits and vegetables", "ar": "الفواكه والخضروات"}}, "C": {"category": {"en": "things you can buy in a market", "ar": "أشياء تشتريها من السوق"}}}, "STORIES": {"A": {"en": "Last Friday, Fatima drove with her grandson to the old market in Al Ain. She bought dates and a blue scarf. On the way home the car had a flat tyre, and a kind policeman helped them change it before sunset.", "ar": "يوم الجمعة الماضي، ذهبت فاطمة بالسيارة مع حفيدها إلى السوق القديم في العين. اشترت تمراً ووشاحاً أزرق. وفي طريق العودة انثقب إطار السيارة، وساعدهم شرطي لطيف في تغييره قبل غروب الشمس.", "units": {"en": [["friday"], ["fatima"], ["grandson"], ["market"], ["al ain", "ain"], ["dates"], ["scarf"], ["blue"], ["tyre", "tire", "flat"], ["policeman", "police"], ["helped", "change"], ["sunset"]], "ar": [["الجمعه", "جمعه"], ["فاطمه"], ["حفيدها", "حفيد"], ["السوق", "سوق"], ["العين"], ["تمرا", "تمر"], ["وشاح", "وشاحا"], ["ازرق"], ["اطار", "انثقب"], ["شرطي", "شرطه"], ["ساعدهم", "تغييره"], ["غروب"]]}}, "B": {"en": "On Monday morning, Ahmed took the bus to the hospital in Sharjah to visit his brother. He brought him oranges and a newspaper. The doctor said his brother could go home on Thursday, so Ahmed called his sister to share the good news.", "ar": "صباح يوم الاثنين، ركب أحمد الحافلة إلى المستشفى في الشارقة لزيارة أخيه. أحضر له برتقالاً وجريدة. قال الطبيب إن أخاه يستطيع العودة إلى البيت يوم الخميس، فاتصل أحمد بأخته ليخبرها بالخبر السعيد.", "units": {"en": [["monday"], ["ahmed"], ["bus"], ["hospital"], ["sharjah"], ["brother"], ["oranges", "orange"], ["newspaper"], ["doctor"], ["thursday"], ["sister", "called"], ["good news", "news"]], "ar": [["الاثنين"], ["احمد"], ["الحافله", "حافله", "باص"], ["المستشفى", "مستشفى"], ["الشارقه"], ["اخيه", "اخوه", "اخاه"], ["برتقالا", "برتقال"], ["جريده"], ["الطبيب", "طبيب", "دكتور"], ["الخميس"], ["اخته", "اتصل"], ["الخبر", "السعيد"]]}}, "C": {"en": "During the holiday, Mariam cooked rice and fish for twelve guests. Her neighbour brought a cake with yellow flowers. After dinner, everyone walked to the beach and the children played until the call to prayer.", "ar": "في أيام العيد، طبخت مريم الأرز والسمك لاثني عشر ضيفاً. أحضرت جارتها كعكة عليها زهور صفراء. وبعد العشاء، مشى الجميع إلى الشاطئ ولعب الأطفال حتى الأذان.", "units": {"en": [["holiday", "eid"], ["m xt": "الكُولِيسْتِرُولُ الضَّارُّ مُرْتَفِعٌ لَدَيْكَ. نَاقِشِ العِلَاجَ وَتَغْيِيرَ الغِذَاءِ مَعَ طَبِيبِكَ.", "evidence": "Lancet Commission 2024 (LDL cholesterol)"}, {"rule": "activity", "text": "حَاوِلْ أَنْ تَتَحَرَّكَ 150 دَقِيقَةً فِي الأُسْبُوعِ، مِثْلَ المَشْيِ 30 دَقِيقَةً بَعْدَ المَغْرِبِ خَمْسَةَ أَيَّامٍ. المَشْيُ فِي المَرَاكِزِ التِّجَارِيَّةِ مُنَاسِبٌ فِي أَشْهُرِ الحَرِّ.", "evidence": "WHO physical activity guidelines; Lancet Commission 2024"}, {"rule": "smoking", "text": "الإِقْلَاعُ عَنِ التَّدْخِينِ، بِمَا فِيهِ الشِّيشَةُ وَالمِدْوَاخُ، يُفِيدُ الدِّمَاغَ فِي أَيِّ عُمْرٍ. يُمْكِنُ لِعِيَادَتِكَ تَحْوِيلُكَ لِخِدْمَةِ الإِقْلَاعِ.", "evidence": "Lancet Commission 2024 (smoking)"}], "all_matched": ["bp", "glucose", "ldl", "activity", "smoking", "cognitive_engagement"]}}, "risk_context": {"modifiable_factors_present": ["hypertension", "diabetes", "ldl", "physical_inactivity", "smoking", "low_education"], "count": 6, "of": 14, "family_history_dementia": true, "genomic": null, "reversible_cause_checks": ["TSH", "Vitamin B12", "Folate", "Full blood count", "HbA1c", "Renal function", "Medication review (anticholinergic burden)", "Depression (PHQ-9)", "Sleep apnoea screen (STOP-BANG)", "Hearing and vision"]}, "fhir_example": {"resourceType": "Bundle", "id": "3e0d35f1-02ec-4e24-8f42-baf58d7eb8bb", "type": "collection", "entry": [{"fullUrl": "urn:uuid:MB-1187", "resource": {"resourceType": "Patient", "id": "MB-1187", "identifier": [{"system": "https://fhir.membrain.health/NamingSystem/pseudonym", "value": "MB-1187"}], "gender": "male", "communication": [{"language": {"coding": [{"system": "urn:ietf:bcp:47", "code": "ar", "display": "Arabic"}], "text": "Arabic"}, "preferred": true}], "extension": [{"url": "https://fhir.membrain.health/CodeSystem/ext/education-band", "valueCode": "primary"}, {"url": "https://fhir.membrain.health/CodeSystem/ext/age-band", "valueString": "70-75"}, {"url": "https://fhir.membrain.health/CodeSystem/ext/dialect", "valueStrin ": "2026-08-30"}], "prevention": {"en": {"version": "pv-0.2.0", "items": [{"rule": "activity", "text": "Aim for 150 minutes of moving each week, for example a 30-minute walk after Maghrib on five days. Indoor malls are fine in the hot months.", "evidence": "WHO physical activity guidelines; Lancet Commission 2024"}, {"rule": "sleep", "text": "Your sleep is short or broken. Keep regular sleep times, and ask your doctor about snoring or pauses in breathing.", "evidence": "Sleep and cognition evidence; screen for sleep apnoea"}, {"rule": "social", "text": "Staying connected matters. Regular visits with family, the majlis, or community activities keep the mind active.", "evidence": "Lancet Commission 2024 (social isolation)"}, {"rule": "mood", "text": "You told us you have been feeling low or worried. This is common and treatable. Talking to someone helps; your clinic can connect you.", "evidence": "Lancet Commission 2024 (depression)"}, {"rule": "cognitive_engagement", "text": "Keep your mind active: reading, Quran memorisation, learning a skill, or games with grandchildren all count.", "evidence": "Lancet Commission 2024 (education / cognitive activity)"}], "all_matched": ["activity", "sleep", "social", "mood", "cognitive_engagement"]}, "ar": {"version": "pv-0.2.0", "items": [{"rule": "activity", "text": "حَاوِلْ أَنْ تَتَحَرَّكَ 150 دَقِيقَةً فِي الأُسْبُوعِ، مِثْلَ المَشْيِ 30 دَقِيقَةً بَعْدَ المَغْرِبِ خَمْسَةَ أَيَّامٍ. المَشْيُ فِي المَرَاكِزِ التِّجَارِيَّةِ مُنَاسِبٌ فِي أَشْهُرِ الحَرِّ.", "evidence": "WHO physical activity guidelines; Lancet Commission 2024"}, {"rule": "sleep", "text": "نَوْمُكَ قَصِيرٌ أَوْ مُتَقَطِّعٌ. حَافِظْ عَلَى مَوَاعِيدِ نَوْمٍ ثَابِتَةٍ، وَاسْأَلْ طَبِيبَكَ عَنِ الشَّخِيرِ أَوْ تَوَقُّفِ التَّنَفُّسِ أَثْنَاءَ النَّوْمِ.", "evidence": "Sleep and cognition evidence; screen for sleep apnoea"}, {"rule": "social", "text": "التَّوَاصُلُ مُهِمٌّ. الزِّيَارَاتُ العَائِلِيَّةُ المُنْتَظَمَةُ أَوِ المَجْلِسُ أَوِ الأَنْشِطَةُ المُجْتَمَعِيَّ مِ لَدَيْكَ أَعْلَى مِنَ المُعَدَّلِ الصِّحِّيِّ. ضَبْطُهُ يَحْمِي الدِّمَاغَ. رَاجِعْ طَبِيبَكَ وَقِسِ الضَّغْطَ فِي البَيْتِ.", "evidence": "Lancet Commission 2024 (hypertension); SPRINT MIND"}, {"rule": "glucose", "text": "مُسْتَوَى السُّكَّرِ لَدَيْكَ مُرْتَفِعٌ. ضَبْطُ السُّكَّرِيِّ يُقَلِّلُ الخَطَرَ عَلَى الذَّاكِرَةِ. اسْأَلْ عِيَادَتَكَ عَنْ هَدَفِ السُّكَّرِ التَّرَاكُمِيِّ.", "evidence": "Lancet Commission 2024 (diabetes)"}, {"rule": "activity", "text": "حَاوِلْ أَنْ تَتَحَرَّكَ 150 دَقِيقَةً فِي الأُسْبُوعِ، مِثْلَ المَشْيِ 30 دَقِيقَةً بَعْدَ المَغْرِبِ خَمْسَةَ أَيَّامٍ. المَشْيُ فِي المَرَاكِزِ التِّجَارِيَّةِ مُنَاسِبٌ فِي أَشْهُرِ الحَرِّ.", "evidence": "WHO physical activity guidelines; Lancet Commission 2024"}, {"rule": "hearing", "text": "قَدْ تُوَاجِهُ صُعُوبَةً فِي السَّمْعِ. فَحْصُ السَّمْعِ وَاسْتِخْدَامُ السَّمَّاعَةِ عِنْدَ الحَاجَةِ يُسَاعِدَانِ فِي حِمَايَةِ الذَّاكِرَةِ.", "evidence": "Lancet Commission 2024 (hearing loss; ACHIEVE trial)"}, {"rule": "vision", "text": "يُرْجَى فَحْصُ النَّظَرِ. عِلَاجُ مَشَاكِلِ النَّظَرِ مِثْلَ المَاءِ الأَبْيَضِ يَدْعَمُ صِحَّةَ الدِّمَاغِ.", "evidence": "Lancet Commission 2024 (untreated vision loss)"}], "all_matched": ["bp", "glucose", "activity", "hearing", "vision", "cognitive_engagement"]}}, "risk_context": {"modifiable_factors_present": ["diabetes", "physical_inactivity", "hearing_loss", "vision_loss", "low_education"], "count": 5, "of": 14, "family_history_dementia": null, "genomic": null, "reversible_cause_checks": ["TSH", "Vitamin B12", "Folate", "Full blood count", "HbA1c", "Renal function", "Medication review (anticholinergic burden)", "Depression (PHQ-9)", "Sleep apnoea screen (STOP-BANG)", "Hearing and vision"]}, "fhir_example": {"resourceType": "Bundle", "id": "1e275042-094e-49f9-befb-dd0302df794d", "type": "collection", "entry": [{"fullUrl": "urn:uuid:MB-1510", "resource": {"resourceType": "Patient", "id": "MB-1510", "identifier": [{"system": "https://fhir.membrain.health/NamingSystem/pse tion/c9ef01d7-2c81-41ce-8d15-cbfd13ddfd3f"}], "prediction": [{"outcome": {"coding": [{"system": "https://fhir.membrain.health/CodeSystem/triage-level", "code": "CHECK_AGAIN", "display": "Check Again"}], "text": "Check Again"}, "qualitativeRisk": {"coding": [{"system": "http://terminology.hl7.org/CodeSystem/risk-probability", "code": "moderate", "display": "Moderate"}], "text": "Moderate"}, "rationale": "Change beyond measurement noise, but possible explanation present: hearing or vision difficulty at pre-check, session completed with a helper"}], "note": [{"text": "Risk/change identification only. Not a diagnosis. This is a screening signal of change, not a diagnosis. Scores vary from day to day; the 90% range shows how much the true change could differ from what was measured. Thresholds are provisional until validated in the local population (Phase 2)."}]}}, {"fullUrl": "urn:uuid:40def87d-d080-4532-9b78-820491f2308b", "resource": {"resourceType": "ServiceRequest", "id": "40def87d-d080-4532-9b78-820491f2308b", "status": "draft", "intent": "order", "priority": "routine", "code": {"coding": [{"system": "https://fhir.membrain.health/CodeSystem/pathway", "code": "audiology", "display": "Hearing assessment"}], "text": "Hearing assessment"}, "subject": {"reference": "Patient/MB-1510"}, "authoredOn": "2026-09-13", "performer": [{"display": "SVC-08"}], "reasonCode": [{"text": "Clinician confirmed concern after review"}], "extension": [{"url": "https://fhir.membrain.health/CodeSystem/ext/referral-state", "valueCode": "recommended"}], "note": [{"text": "2026-09-13 recommended Clinician confirmed concern after review"}]}}]}}], "messages": {"BASELINE": ["Thank you. We are learning what is normal for you. We will remind you about the next short session.", "شُكْرًا لَكَ. نَحْنُ نَتَعَرَّفُ عَلَى مُسْتَوَاكَ الطَّبِيعِيِّ. سَنُذَكِّرُكَ بِالجَلْسَةِ القَصِيرَةِ القَادِمَةِ."], "STABLE": ["Your results are steady compared with your own earlier results. Here are a few things that help keep your brain healthy.", "نَتَائِجُكَ مُسْتَقِرَّةٌ مُقَارَنَةً بِنَتَائِجِكَ السَّابِقَةِ. إِلَيْكَ بَعْضَ الأُمُورِ الَّتِي تُسَاعِدُ فِي الحِفَاظِ عَلَى صِحَّةِ دِمَاغِكَ."], "CHECK_AGAIN": ["Today's result was a little different from your usual. This often happens because of tiredness, poor sleep, worry or illness. We will ask you to do a short session again in 2 to 4 weeks.", "نَتِيجَةُ اليَوْمِ مُخْتَلِفَةٌ قَلِيلًا عَنِ المُعْتَادِ. يَحْدُثُ هَذَا غَالِبًا بِسَبَبِ التَّعَبِ أَوْ قِلَّةِ النَّوْمِ أَوْ القَلَقِ أَوْ المَرَضِ. سَنَطْلُبُ مِنْكَ جَلْسَةً قَصِيرَةً أُخْرَى بَعْدَ أُسْبُوعَيْنِ إِلَى أَرْبَعَةِ أَسَابِيعَ."], "CLINICIAN_REVIEW": ["Thank you. Your clinic will contact you to talk about your results. This is not a diagnosis.", "شُكْرًا لَكَ. سَتَتَوَاصَلُ مَعَكَ عِيَادَتُكَ لِلْحَدِيثِ عَنْ نَتَائِجِكَ. هَذَا لَيْسَ تَشْخِيصًا."], "URGENT": ["Thank you. Your clinic will contact you soon to talk about your results. This is not a diagnosis.", "شُكْرًا لَكَ. سَتَتَوَاصَلُ مَعَكَ عِيَادَتُكَ قَرِيبًا لِلْحَدِيثِ عَنْ نَتَائِجِكَ. هَذَا لَيْسَ تَشْخِيصًا."], "INVALID": ["We could not hear the recording clearly, so today's session was not scored. Please try again in a quiet place.", "لَمْ نَتَمَكَّنْ مِنْ سَمَاعِ التَّسْجِيلِ بِوُضُوحٍ، لِذَلِكَ لَمْ تُحْسَبْ جَلْسَةُ اليَوْمِ. يُرْجَى المُحَاوَلَةُ مَرَّةً أُخْرَى فِي مَكَانٍ هَادِئٍ."], "MOOD_SUPPORT": ["You mentioned feeling low or worried. You are not alone, and help is available. Your clinic can connect you with support.", "ذَكَرْتَ أَنَّكَ تَشْعُرُ بِالحُزْنِ أَوِ القَلَقِ. لَسْتَ وَحْدَكَ، وَالمُسَاعَدَةُ مُتَاحَةٌ. يُمْكِنُ لِعِيَادَتِكَ أَنْ تُسَاعِدَكَ فِي الحُصُولِ عَلَى الدَّعْمِ."]}, "prevention_rules": [{"id": "bp", "evidence": "Lancet Commission 2024 (hypertension); SPRINT MIND", "en": "Your blood pressure is above the healthy range. Controlling it protects the brain. Please review it with your doctor and check it at home.", "ar": "ضَغْطُ الدَّمِ لَدَيْكَ أَعْلَى مِنَ المُعَدَّلِ الصِّحِّيِّ. ضَبْطُهُ يَحْمِي الدِّمَاغَ. رَاجِعْ طَبِيبَكَ وَقِسِ الضَّغْطَ فِي البَيْتِ."}, {"id": "glucose", "evidence": "Lancet Commission 2024 (diabetes)", "en": "Your blood sugar is high. Keeping diabetes well controlled lowers the risk to memory. Ask your clinic about your HbA1c target.", "ar": "مُسْتَوَى السُّكَّرِ لَدَيْكَ مُرْتَفِعٌ. ضَبْطُ السُّكَّرِيِّ يُقَلِّلُ الخَطَرَ عَلَى الذَّاكِرَةِ. اسْأَلْ عِيَادَتَكَ عَنْ هَدَفِ السُّكَّرِ التَّرَاكُمِيِّ."}, {"id": "ldl", "evidence": "Lancet Commission 2024 (LDL cholesterol)", "en": "Your LDL cholesterol is raised. Discuss treatment and diet changes with your doctor.", "ar": "الكُولِيسْتِرُولُ الضَّارُّ مُرْتَفِعٌ لَدَيْكَ. نَاقِشِ العِلَاجَ وَتَغْيِيرَ الغِذَاءِ مَعَ طَبِيبِكَ."}, {"id": "activity", "evidence": "WHO physical activity guidelines; Lancet Commission 2024", "en": "Aim for 150 minutes of moving each week, for example a 30-minute walk after Maghrib on five days. Indoor malls are fine in the hot months.", "ar": "حَاوِلْ أَنْ تَتَحَرَّكَ 150 دَقِيقَةً فِي الأُسْبُوعِ، مِثْلَ المَشْيِ 30 دَقِيقَةً بَعْدَ المَغْرِبِ خَمْسَةَ أَيَّامٍ. المَشْيُ فِي المَرَاكِزِ التِّجَارِيَّةِ مُنَاسِبٌ فِي أَشْهُرِ الحَرِّ."}, {"id": "sleep", "evidence": "Sleep and cognition evidence; screen for sleep apnoea", "en": "Your sleep is short or broken. Keep regular sleep times, and ask your doctor about snoring or pauses in breathing.", "ar": "نَوْمُكَ قَصِيرٌ أَوْ مُتَقَطِّعٌ. حَافِظْ عَلَى مَوَاعِيدِ نَوْمٍ ثَابِتَةٍ، وَاسْأَلْ طَبِيبَكَ عَنِ الشَّخِيرِ أَوْ تَوَقُّفِ التَّنَفُّسِ أَثْنَاءَ النَّوْمِ."}, {"id": "hearing", "evidence": "Lancet Commission 2024 (hearing loss; ACHIEVE trial)", "en": "You may have trouble hearing. A hearing test, and hearing aids if needed, help protect memory.", "ar": "قَدْ تُوَاجِهُ صُعُوبَةً فِي السَّمْعِ. فَحْصُ السَّمْعِ وَاسْتِخْدَامُ السَّمَّاعَةِ عِنْدَ الحَاجَةِ يُسَاعِدَانِ فِي حِمَايَةِ الذَّاكِرَةِ."}, {"id": "vision", "evidence": "Lancet Commission 2024 (untreated vision loss)", "en": "Please have your eyes checked. Treating vision problems such as cataract supports brain health.", "ar": "يُرْجَى فَحْصُ النَّظَرِ. عِلَاجُ مَشَاكِلِ النَّظَرِ مِثْلَ المَاءِ الأَبْيَضِ يَدْعَمُ صِحَّةَ الدِّمَاغِ."}, {"id": "smoking", "evidence": "Lancet Commission 2024 (smoking)", "en": "Stopping smoking, including shisha and medwakh, helps your brain at any age. Your clinic can refer you to a quit service.", "ar": "الإِقْلَاعُ عَنِ التَّدْخِينِ، بِمَا فِيهِ الشِّيشَةُ وَالمِدْوَاخُ، يُفِيدُ الدِّمَاغَ فِي أَيِّ عُمْرٍ. يُمْكِنُ لِعِيَادَتِكَ تَحْوِيلُكَ لِخِدْمَةِ الإِقْلَاعِ."}, {"id": "weight", "evidence": "Lancet Commission 2024 (obesity)", "en": "Reaching a healthier weight helps blood pressure, sugar and the brain. Ask about the clinic's nutrition support.", "ar": "الوُصُولُ إِلَى وَزْنٍ صِحِّيٍّ يُسَاعِدُ الضَّغْطَ وَالسُّكَّرَ وَالدِّمَاغَ. اسْأَلْ عَنْ دَعْمِ التَّغْذِيَةِ فِي العِيَادَةِ."}, {"id": "social", "evidence": "Lancet Commission 2024 (social isolation)", "en": "Staying connected matters. Regular visits with family, the majlis, or community activities keep the mind active.", "ar": "التَّوَاصُلُ مُهِمٌّ. الزِّيَارَاتُ العَائِلِيَّةُ المُنْتَظَمَةُ أَوِ المَجْلِسُ أَوِ الأَنْشِطَةُ المُجْتَمَعِيَّةُ تُبْقِي العَقْلَ نَشِيطًا."}, {"id": "mood", "evidence": "Lancet Commission 2024 (depression)", "en": "You told us you have been feeling low or worried. This is common and treatable. Talking to someone helps; your clinic can connect you.", "ar": "ذَكَرْتَ أَنَّكَ تَشْعُرُ بِالحُزْنِ أَوِ القَلَقِ. هَذَا شَائِعٌ وَيُمْكِنُ عِلَاجُهُ. الحَدِيثُ مَعَ مُخْتَصٍّ يُسَاعِدُ، وَيُمْكِنُ لِعِيَادَتِكَ مُسَاعَدَتُكَ."}], "navigator": {"version": "nav-0.1.0", "directory": [{"id": "SVC-01", "name": "Memory Clinic — Abu Dhabi City (synthetic)", "pathways": ["memory_clinic"], "emirate": "Abu Dhabi", "area": "Abu Dhabi City", "languages": ["ar", "en"], "funding": ["thiqa", "enhanced"], "wait_weeks": 6, "last_verified": "2026-10-20", "capacity_per_month": 20, "accepting   function trendChart(hist) {
    const W = 760, H = 230, pl = 46, pr = 34, pt = 14, pb = 30;
    const pts = hist.map((h) => ({ d: Date.parse(h.date), z: h.z ? h.z.composite : null, lv: h.level, valid: h.valid }));
    const zs = pts.filter((p) => p.z != null).map((p) => p.z); const lo = Math.min(-2.5, ...zs) - 0.2, hi = Math.max(1.5, ...zs) + 0.2;
    const d0 = pts[0].d, d1 = Math.max(pts[pts.length - 1].d, d0 + 86400000 * 30);
    const X = (d) => pl + ((d - d0) / (d1 - d0)) * (W - pl - pr), Y = (z) => pt + ((hi - z) / (hi - lo)) * (H - pt - pb);
    let g = "";
    for (let z = Math.ceil(lo); z <= hi; z++) g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(z)}" y2="${Y(z)}" stroke="#eee7da"/><text x="${pl - 8}" y="${Y(z) + 4}" font-size="11" text-anchor="end" fill="#7a8587">${z}</text>`;
    g += `<rect x="${pl}" y="${Y(1)}" width="${W - pl - pr}" height="${Y(-1) - Y(1)}" fill="#e2efef" opacity=".55"/>`;
    g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(C.LOW_BASELINE_Z)}" y2="${Y(C.LOW_BASELINE_Z)}" stroke="#b2462e" stroke-dasharray="4 4" opacity=".6"/><text x="${W - pr}" y="${Y(C.LOW_BASELINE_Z) - 5}" font-size="10.5" text-anchor="end" fill="#b2462e">below expected for age &amp; education</text>`;
    const lastR = [...hist].reverse().find((h) => h.rci);
    if (lastR) { const c = lastR.rci.composite; const lim = c.baseline + c.expected_practice + C.RCI_CHECK * c.se_diff;
      g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(c.baseline)}" y2="${Y(c.baseline)}" stroke="#0f5c63" stroke-width="1.5"/><text x="${W - pr}" y="${Y(c.baseline) + (lim > c.baseline ? 13 : -5)}" font-size="10.5" text-anchor="end" fill="#0f5c63">personal baseline</text>`;
      g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(lim)}" y2="${Y(lim)}" stroke="#a8661b" stroke-dasharray="6 3"/><text x="${W - pr}" y="${Y(lim) + (lim > c.baseline ? -5 : 13)}" font-size="10.5" text-anchor="end" fill="#a8661b">reliable-change limit (practice-adjusted)</text>`; }
    const v = pts.filter((p) => p.z != null);
    g += `<polyline fill="none" stroke="#9aa6a8" stroke-width="1.5" points="${v.map((p) => X(p.d) + "," + Y(p.z)).join(" ")}"/>`;
    pts.forEach((p) => { if (p.z == null) g += `<circle cx="${X(p.d)}" cy="${H - pb - 6}" r="5" fill="#fff" stroke="#888" stroke-width="1.5"><title>${new Date(p.d).toISOString().slice(0, 10)} not scored</title></circle>`;
      else g += `<circle cx="${X(p.d)}" cy="${Y(p.z)}" r="6" fill="${LVCOL[p.lv]}" stroke="#fff" stroke-width="2"><title>${new Date(p.d).toISOString().slice(0, 10)} · z ${p.z} · ${LV[p.lv]}</title></circle>`; });
    let lastX = -99; pts.forEach((p) => { const x = X(p.d); if (x - lastX < 52) return; lastX = x; g += `<text x="${x}" y="${H - 8}" font-size="10.5" text-anchor="middle" fill="#7a8587">${new Date(p.d).toISOString().slice(2, 10)}</text>`; });
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Composite score over time"><text x="10" y="${H / 2}" font-size="11" fill="#7a8587" transform="rotate(-90 10 ${H / 2})" text-anchor="middle">composite z (education-adjusted)</text>${g}</svg>`;
  }

  function fhirBundle(p, ev) {

      code: cc(CS + "/pathway", r.pathway, PATH[r.pathway] || r.pathway), subject: { reference: "Patient/" + p.id }, authoredOn: r.history[0].date, performer: [{ display: r.service_id || "to be assigned" }],

  // ================================================================ VALIDATION
  // ---------------------------------------------------------------- evidence pack (robustness, sweep, ablation, decision curve)
  const EVC = { teal: "#0b8a7a", orange: "#c0761a", blue: "#4b5fc0", ink: "#1d2a2e", muted: "#5f6b6e", grid: "#eee7da" };
  function evidenceSection() {
    const X = window.MB_EVIDENCE; if (!X) return "";
    const R = X.robustness.summary; const ms = (k, p = true) => p ? `${pct(R[k].mean)} <span class="muted small">± ${Math.round(R[k].sd * 1000) / 10} pts</span>` : `${Math.round(R[k].mean)} <span class="muted small">± ${Math.round(R[k].sd)}</span>`;
    const sw = X.sweep.configs; const W = 560, H = 300, pl = 52, pr = 16, pt = 14, pb = 40;
    const xs = sw.map((s) => s.false_referrals_per_1000), ys = sw.map((s) => s.sensitivity);
    const x0 = 0, x1 = Math.ceil(Math.max(...xs) / 50) * 50, y0 = Math.floor(Math.min(...ys) * 20) / 20, y1 = Math.min(1, Math.ceil(Math.max(...ys) * 20) / 20);
    const SX = (v) => pl + ((v - x0) / (x1 - x0)) * (W - pl - pr), SY = (v) => pt + ((y1 - v) / (y1 - y0)) * (H - pt - pb);
    const col = { "composite only": EVC.orange, "composite + delayed recall": EVC.teal, "any domain": EVC.blue };
    let g = "";
    for (let v = x0; v <= x1; v += 50) g += `<line x1="${SX(v)}" x2="${SX(v)}" y1="${pt}" y2="${H - pb}" stroke="${EVC.grid}"/><text x="${SX(v)}" y="${H - pb + 16}" font-size="11" text-anchor="middle" fill="${EVC.muted}">${v}</text>`;
    for (let v = y0; v <= y1 + 1e-9; v += 0.05) g += `<line x1="${pl}" x2="${W - pr}" y1="${SY(v)}" y2="${SY(v)}" stroke="${EVC.grid}"/><text x="${pl - 6}" y="${SY(v) + 4}" font-size="11" text-anchor="end" fill="${EVC.muted}">${Math.round(v * 100)}%</text>`;
    const front = sw.filter((s) => s.pareto).sort((a, b) => a.false_referrals_per_1000 - b.false_referrals_per_1000);
    g += `<polyline fill="none" stroke="${EVC.ink}" stroke-dasharray="5 4" stroke-width="1.3" points="${front.map((s) => SX(s.false_referrals_per_1000) + "," + SY(s.sensitivity)).join(" ")}"/>`;
    sw.forEach((s) => { g += `<circle cx="${SX(s.false_referrals_per_1000)}" cy="${SY(s.sensitivity)}" r="${s.chosen ? 7 : 5}" fill="${col[s.trigger]}" fill-opacity=".85" stroke="${s.chosen ? EVC.ink : "#fff"}" stroke-width="${s.chosen ? 2.5 : 1.5}"><title>RCI ≤ ${s.rci} · ${s.trigger} · entry z ≤ ${s.low_baseline} · baseline ${s.baseline_k} sessions\nSensitivity ${pct(s.sensitivity)} · ${s.false_referrals_per_1000} false referrals per 1,000 · change detection ${pct(s.change_sensitivity)}${s.chosen ? "\nCHOSEN DEFAULT" : ""}</title></circle>`; });
    const ch = sw.find((s) => s.chosen);
    g += `<text x="${SX(ch.false_referrals_per_1000) + 10}" y="${SY(ch.sensitivity) + 18}" font-size="11" fill="${EVC.ink}">chosen default</text>`;
    g += `<text x="${(pl + W - pr) / 2}" y="${H - 6}" font-size="11" text-anchor="middle" fill="${EVC.muted}">False referrals per 1,000 screened</text>`;
    const sweepSvg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Operating point sweep">${g}</svg>
      <div class="legend">${Object.entries(col).map(([k, c]) => `<span><i style="background:${c}"></i>${k}</span>`).join("")}<span>- - best trade-off</span><span>Hover a point for its settings</span></div>`;
    // decision curve
    const dc = X.decision_curve; const DW = 560, DH = 260; const dmax = Math.max(...dc.membrain) * 1.2, dmin = -0.05;
    const DX = (v) => pl + ((v - 0.05) / 0.35) * (DW - pl - pr), DY = (v) => pt + ((dmax - Math.max(dmin, v)) / (dmax - dmin)) * (DH - pt - pb);
    let d = "";
    [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4].forEach((v) => (d += `<line x1="${DX(v)}" x2="${DX(v)}" y1="${pt}" y2="${DH - pb}" stroke="${EVC.grid}"/><text x="${DX(v)}" y="${DH - pb + 16}" font-size="11" text-anchor="middle" fill="${EVC.muted}">${Math.round(v * 100)}%</text>`));
    [-0.05, 0, 0.05, 0.1].filter((v) => v <= dmax).forEach((v) => (d += `<line x1="${pl}" x2="${DW - pr}" y1="${DY(v)}" y2="${DY(v)}" stroke="${EVC.grid}"/><text x="${pl - 6}" y="${DY(v) + 4}" font-size="11" text-anchor="end" fill="${EVC.muted}">${v.toFixed(2)}</text>`));
    const line = (arr, c, dash, w) => `<polyline fill="none" stroke="${c}" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ""} points="${dc.pt.map((p, i) => [p, arr[i]]).filter(([, v]) => v >= dmin).map(([p, v]) => DX(p) + "," + DY(v)).join(" ")}"/>`;
    d += line(dc.refer_none, EVC.muted, "", 1.2) + line(dc.refer_all, EVC.blue, "6 4", 1.5) + line(dc.usual_care, EVC.orange, "", 2.2) + line(dc.membrain, EVC.teal, "", 2.2);
    dc.pt.forEach((p, i) => (d += `<rect x="${DX(p) - 4}" y="${pt}" width="8" height="${DH - pt - pb}" fill="transparent"><title>Threshold ${Math.round(p * 100)}%\nMemBrain ${dc.membrain[i]} · Usual care ${dc.usual_care[i]} · Refer all ${dc.refer_all[i]}</title></rect>`));
    d += `<text x="${(pl + DW - pr) / 2}" y="${DH - 6}" font-size="11" text-anchor="middle" fill="${EVC.muted}">Threshold probability at which a clinician would refer</text>`;
    const dcSvg = `<svg viewBox="0 0 ${DW} ${DH}" width="100%" role="img" aria-label="Decision curve">${d}</svg><div class="legend"><span><i style="background:${EVC.teal}"></i>MemBrain</span><span><i style="background:${EVC.orange}"></i>Usual care</span><span><i style="background:${EVC.blue}"></i>Refer everyone</span><span><i style="background:${EVC.muted}"></i>Refer no one</span></div>`;
    const ab = X.ablation.rows; const full = ab[0];
    const abRows = ab.map((a) => `<tr ${a.name === "Full MemBrain" ? 'style="font-weight:700"' : ""}><td>${esc(a.name)}</td><td class="num">${pct(a.sensitivity)}</td><td class="num">${pct(a.specificity)}</td>
      <td class="num">${a.false_referrals_per_1000}</td><td class="num" style="color:${a.false_referrals_per_1000 > full.false_referrals_per_1000 * 1.1 ? "var(--review)" : "inherit"}">${a.name === "Full MemBrain" ? "–" : (a.false_referrals_per_1000 >= full.false_referrals_per_1000 ? "+" : "") + Math.round((a.false_referrals_per_1000 / full.false_referrals_per_1000 - 1) * 100) + "%"}</td>
      <td class="num">${a.derived ? "–" : pct(a.change_sensitivity)}</td></tr>`).join("");
    const cc = X.candidate_check.rows;
    return `<h2 style="margin:26px 0 4px">Evidence pack: is the design doing the work?</h2>
      <div class="small muted" style="margin-bottom:12px">Same synthetic assumptions as above. These checks show which choices matter, how stable the results are, and whether our default setting was tuned to fit one cohort. Source: <code>scripts/evidence_pack.py</code>.</div>
      <div class="kpis">${[["Sensitivity", ms("sensitivity")], ["Specificity", ms("specificity")], ["PPV", ms("ppv")], ["False referrals / 1,000", ms("false_referrals_per_1000", false)], ["Usual care sensitivity", ms("uc_sensitivity")], ["False positives at entry, no schooling", `${pct(R.fp_entry_noedu_stratified.mean)} <span class="muted small">vs ${pct(R.fp_entry_noedu_naive.mean)} single cutoff</span>`]]
        .map(([l, v]) => `<div class="panel kpi"><div class="v" style="font-size:22px">${v}</div><div class="l">${l}</div><div class="ci">mean ± SD, 10 cohorts × 2,000</div></div>`).join("")}</div>
      <div class="two" style="margin-top:16px">
        <div class="panel pad"><h3>What each design choice contributes</h3><div class="small muted">Same people and sessions (n = 2,000); one component switched off at a time.</div>
          <table style="margin-top:8px"><tr><th>Engine</th><th class="num">Sens.</th><th class="num">Spec.</th><th class="num">False ref. /1,000</th><th class="num">vs full</th><th class="num">Change det.</th></tr>${abRows}</table>
          <div class="tiny muted" style="margin-top:6px">Confirmation on repeat and education-stratified norms remove the most false referrals. Practice adjustment buys sensitivity (practice gains otherwise hide decline). In this simulation the confounder rules change little, because confirmation already absorbs one-off dips.</div></div>
        <div class="panel pad"><h3>Operating point: 72 engine settings</h3>${sweepSvg}</div></div>
      <div class="two" style="margin-top:16px">
        <div class="panel pad"><h3>Did we over-fit the default?</h3><div class="small muted">The best-looking settings from one cohort, re-tested on 5 fresh cohorts (n = 2,000 each).</div>
          <table style="margin-top:8px"><tr><th>Setting</th><th class="num">Sens.</th><th class="num">False ref. /1,000</th><th class="num">PPV</th><th class="num">Change det.</th></tr>
          ${cc.map((r) => `<tr><td><b>${esc(r.label)}</b><div class="tiny muted">RCI ≤ ${r.config.RCI_CHECK} · ${esc(r.config.TRIGGER_DOMAINS)} · entry z ≤ ${r.config.LOW_BASELINE_Z} · baseline ${r.config.BASELINE_SESSIONS}</div></td><td class="num">${pct(r.sensitivity)}</td><td class="num">${r.false_referrals_per_1000}</td><td class="num">${pct(r.ppv)}</td><td class="num">${pct(r.change_sensitivity)}</td></tr>`).join("")}</table>
          <div class="tiny muted" style="margin-top:6px">Stricter settings halve false referrals but detect far less change over time. We keep the default because MemBrain's job is earlier detection; the stricter setting is the documented option for clinics with little review capacity. The final operating point is fixed on real data in Phase 2, before accuracy is assessed.</div></div>
        <div class="panel pad"><h3>Decision curve</h3><div class="small muted">Net benefit of referring by each strategy, at every threshold a clinician might use.</div>${dcSvg}</div></div>
      <div class="two" style="margin-top:16px">
        <div class="panel pad"><h3>Positive predictive value depends on the setting</h3><table><tr><th>Setting</th><th class="num">Prevalence</th><th class="num">MemBrain PPV</th><th class="num">Usual care PPV</th></tr>
          ${X.prevalence_sensitivity.map((r) => `<tr><td>${esc(r.setting)}</td><td class="num">${pct(r.prevalence)}</td><td class="num"><b>${pct(r.membrain_ppv)}</b></td><td class="num">${pct(r.usual_care_ppv)}</td></tr>`).join("")}</table>
          <div class="tiny muted" style="margin-top:6px">In community outreach most positives are false, so MemBrain is deployed through programmes and clinics, not as an open consumer test.</div></div>
        <div class="panel pad"><h3>Phase 2 sample size (preliminary)</h3><div class="small">${esc(X.sample_size.method)}: about <b>${X.sample_size.n_required}</b> participants for a ±7-point confidence interval on sensitivity at ${pct(X.sample_size.prevalence)} prevalence (${X.sample_size.n_for_specificity} would suffice for specificity).</div>
          <div class="tiny muted" style="margin-top:6px">${esc(X.sample_size.per_subgroup_note)} No-formal-education sensitivity varies between ${pct(R.sens_noedu.min)} and ${pct(R.sens_noedu.max)} across cohorts, so this stratum must be enriched.</div></div></div>`;
  }

  function renderValidation() {
    const V = D.validation, s = V.summary, o = s.overall; const t = s.time_to_assessment_weeks; const ab = s.confounder_rule_ablation;
    const ci = (x) => (x && x[1] != null ? `95% CI ${pct(x[1])}–${pct(x[2])}` : "");
    const kpi = (v, l, c) => `<div class="panel kpi"><div class="v">${v}</div><div class="l">${l}</div><div class="ci">${c || ""}</div></div>`;
    const sg = s.subgroups[S.sub];
    const rows = Object.entries(sg).map(([g, b]) => `<tr><td>${esc(EDU[g] || g)}</td><td class="num">${b.n}</td><td class="num">${pct(b.completion_unaided)}</td><td class="num">${fmt(b.test_retest_icc)}</td>
      <td class="num">${pct(b.membrain.sensitivity[0])}</td><td class="num">${pct(b.membrain.specificity[0])}</td><td class="num">${pct(b.membrain.ppv[0])}</td><td class="num">${b.membrain.referrals_per_confirmed ?? "–"}</td>
      <td class="num muted">${pct(b.usual_care.specificity[0])}</td></tr>`).join("");
    const eduFair = Object.entries(s.subgroups.education).map(([g, b]) => ({ g: EDU[g], naive: 1 - b.baseline_naive.specificity[0], strat: 1 - b.baseline_stratified.specificity[0] }));
    $("#main").innerHTML = `
      <div class="panel pad" style="background:var(--sand-soft);border-color:#ecdcc0;margin-bottom:16px"><b>Synthetic validation run (n = ${V.n.toLocaleString()}, seed ${V.seed}).</b>
        This shows the validation pipeline working end-to-end on simulated people with stated assumptions. It is <b>not</b> clinical evidence. The same code runs on Phase 1 (feasibility) and Phase 2 (reliability and accuracy against an independent clinical reference) data.</div>
      ${navaiGates()}
      <div class="kpis">${kpi(pct(o.completion_unaided), "Sessions completed unaided")}${kpi(fmt(o.test_retest_icc), "Test–retest ICC(2,1), 2 weeks", `${o.n_retest_pairs} stable pairs`)}
        ${kpi(pct(o.membrain.sensitivity[0]), "Sensitivity (12 months)", ci(o.membrain.sensitivity))}${kpi(pct(o.membrain.specificity[0]), "Specificity", ci(o.membrain.specificity))}
        ${kpi(pct(o.membrain.ppv[0]), "Positive predictive value", `prevalence ${pct(s.prevalence.impaired)} impaired`)}${kpi(o.membrain.referrals_per_confirmed, "Referrals per confirmed finding", `usual care ${o.usual_care.referrals_per_confirmed}`)}
        ${kpi((t.membrain_median ?? "–") + " wk", "Median time to clinical assessment", `usual care ${t.usual_care_median} wk*`)}${kpi(fmt(o.change_detection.sensitivity[0] * 100, 0) + "%", "Meaningful change detected", `specificity ${pct(o.change_detection.specificity[0])}`)}</div>
      <div class="two" style="margin-top:16px">
        <div class="panel pad"><h3>MemBrain vs usual care</h3><div class="small muted">Usual care: one education-blind screen at week 0 and week 52.</div>${bars([["Sensitivity", o.membrain.sensitivity[0], o.usual_care.sensitivity[0]], ["Specificity", o.membrain.specificity[0], o.usual_care.specificity[0]], ["PPV", o.membrain.ppv[0], o.usual_care.ppv[0]]], ["MemBrain", "Usual care"])}</div>
        <div class="panel pad"><h3>Fairness: false-positive rate by education</h3><div class="small muted">Share of cognitively normal people wrongly flagged at entry. Education-blind cutoffs penalise people with little schooling.</div>${bars(eduFair.map((e) => [e.g, e.naive, e.strat]), ["Single cutoff", "MemBrain stratified norms"], ["#c0761a", "#0b8a7a"])}</div></div>
      <div class="panel pad" style="margin-top:16px"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h3 style="margin:0">Subgroup performance</h3>
        <div class="seg">${[["dialect", "Language / dialect"], ["age_band", "Age band"], ["education", "Education"]].map(([k, v]) => `<button data-sub="${k}" class="${S.sub === k ? "on" : ""}">${v}</button>`).join("")}</div></div>
        <table style="margin-top:10px"><tr><th>Group</th><th class="num">n</th><th class="num">Completion</th><th class="num">ICC</th><th class="num">Sens.</th><th class="num">Spec.</th><th class="num">PPV</th><th class="num">Ref./confirmed</th><th class="num">Usual-care spec.</th></tr>${rows}</table>
        <div class="tiny muted" style="margin-top:6px">Thresholds are revised if a subgroup falls below the pre-agreed floor. Small subgroups give unstable estimates: no-formal-education sensitivity is 67% in this cohort but ranges widely across cohorts (see the evidence pack below), so Phase 2 enriches this group.</div></div>
      <div class="two" style="margin-top:16px">
        <div class="panel pad"><h3>What the confounder rules buy</h3><table>
          <tr><td>Alerts with confounder rules</td><td class="num">${ab.alerts_with_rules}</td></tr><tr><td>Alerts without them</td><td class="num">${ab.alerts_without_rules}</td></tr>
          <tr><td>False alerts with rules</td><td class="num">${ab.false_alerts_with_rules}</td></tr><tr><td>False alerts without</td><td class="num">${ab.false_alerts_without_rules}</td></tr>
          <tr><td>Repeat sessions triggered ("check again")</td><td class="num">${s.workload.check_again_repeats} of ${s.workload.sessions_total}</td></tr></table>
          ${s.exploratory_voice ? `<h3 style="margin-top:14px">Exploratory voice signal</h3><div class="small">Speech rate AUC for impairment: <b>${s.exploratory_voice.speech_rate_auc_impairment}</b> (simulated). Not used for alerts.</div>` : ""}</div>
        <div class="panel pad"><h3>Assumptions</h3><div class="small" style="max-height:260px;overflow:auto">${Object.entries(V.assumptions).map(([k, v]) => `<div style="margin-bottom:4px"><b>${k.replace(/_/g, " ")}:</b> ${esc(typeof v === "object" ? JSON.stringify(v) : v)}</div>`).join("")}</div>
          <div class="tiny muted" style="margin-top:8px">* ${esc(t.assumptions)}</div></div></div>${evidenceSection()}`;
    document.querySelectorAll("[data-sub]").forEach((b) => (b.onclick = () => { S.sub = b.dataset.sub; renderValidation(); }));
  }
  function navaiGates() {
    const N = D.navai || {}; const r = N.rules, m = N.medgemma; if (!r) return "";
    const cell = (g) => (g ? `${g.value ?? "–"} <span class="pill ${g.pass ? "lv-STABLE" : "lv-CLINICIAN_REVIEW"}">${g.pass ? "pass" : "not yet"}</span>` : '<span class="muted">run pending (FZJ GPU)</span>');
    return `<div class="panel pad" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline"><h3 style="margin:0">Navigator AI release gates: family intake extractor</h3>
      <span class="tiny muted">Held-out test set: ${r.n} synthetic caregiver narratives (Gulf Arabic and English), frozen before the rules were tuned</span></div>
      <table style="margin-top:8px"><tr><th>Gate</th><th>Target</th><th>Rules extractor (always-on fallback)</th><th>${m ? esc(m.model) : "MedGemma 4B"}</th>${m ? "<th>MedGemma + rule red flags</th>" : ""}</tr>
      ${r.gates.map((g, i) => `<tr><td>${esc(g.label)}</td><td class="small">${esc(g.target)}</td><td>${cell(g)}</td><td>${m ? cell(m.gates[i]) : cell(null)}</td>${m ? `<td>${cell(m.combined_gates[i])}</td>` : ""}</tr>`).join("")}</table>
      <div class="tiny muted" style="margin-top:6px">Urgent cases caught by the rules: ${r.urgent_recall_cases}, with ${r.red_flag_false_alarms} false alarms. With so few urgent cases, a perfect score only shows recall above ${r.urgent_recall_wilson_lower95} (95% lower bound); showing 0.99 needs about 300 red-flag narratives, planned for Phase 1.
        The rules pass the safety gates (red flags, nothing unsupported, speed) but not the accuracy gates, which is why the model is evaluated. Whatever the model returns must quote the narrative, and it can never remove a red flag the rules found.</div>
      ${m ? `<div class="small" style="margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--check-soft)"><b>Measured result (${esc(m.date)}): MedGemma 4B, used as is, is not ready and is switched off.</b>
        It caught ${m.urgent.medgemma} urgent cases on its own (rules ${m.urgent.rules}); ${m.dropped_by_grounding} of its facts had no real quote in the narrative and were dropped; p95 latency ${m.gates[5].value} s.
        The safety design held: with the rule red flags added, urgent recall is ${m.urgent.combined}, and the grounding check blocked ${m.drafting.unsupported_sentences} of ${m.drafting.sentences} drafted referral sentences (mostly “memory” added when memory was not reported).
        The rules extractor stays the default; adapting a model on synthetic and then consented Phase 1 narratives is planned work.</div>` : ""}</div>`;
  }
  function bars(rows, names, cols = ["#0b8a7a", "#c0761a"]) {
    const W = 520, rh = 46, H = rows.length * rh + 30, pl = 150, pr = 50;
    const X = (v) => pl + v * (W - pl - pr);
    let g = "";
    rows.forEach((r, i) => { const y = 10 + i * rh; g += `<text x="${pl - 8}" y="${y + 22}" font-size="12" text-anchor="end" fill="#1d2a2e">${esc(r[0])}</text>`;
      [r[1], r[2]].forEach((v, j) => { g += `<rect x="${pl}" y="${y + j * 17 + 4}" width="${Math.max(1, X(v) - pl)}" height="14" rx="3" fill="${cols[j]}"/><text x="${X(v) + 5}" y="${y + j * 17 + 15}" font-size="11" fill="#1d2a2e">${pct(v)}</text>`; }); });
    return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg><div class="legend">${names.map((n, i) => `<span><i style="background:${cols[i]};border-radius:2px"></i>${n}</span>`).join("")}</div>`;
  }

  // ================================================================ HOW IT WORKS
  function renderHow() {
    const reqs = [
      ["Culturally valid and accessible assessment", "Original RUDAS-type voice tasks in Arabic dialects and English, 3 equated alternate forms, education- and age-stratified norms (raw scores always stored), hearing/vision/noise pre-check, large text, high contrast, slower speech, caregiver-assisted mode.", "participant"],
      ["Longitudinal change detection", `Personal baseline from ${C.BASELINE_SESSIONS}–${C.BASELINE_MAX_SESSIONS} sessions. Practice-adjusted reliable change index (RCI ≤ ${C.RCI_CHECK} → repeat; confirmed on repeat → review; ≤ ${C.RCI_LARGE} or rapid drop → urgent). Voice features are tracked on EWMA charts but stay exploratory.`, "clinician"],
      ["Integrated risk context", "Consent-scoped clinical record (BP, HbA1c, LDL), wearables (sleep, activity), mood scales, informant IQCODE, family history and optional genomics, mapped to FHIR R4 and shown with source. No black-box risk score.", "clinician"],
      ["Personalised prevention and timely care", "Clinician-authored, versioned prevention rules in Arabic and English (culturally adapted). Four triage levels with review targets, referral dossier, and suggested reversible-cause work-up.", "participant"],
      ["Safety and human oversight", "Every alert lists its drivers, the confounders checked and a 90% uncertainty range. Review-level results are held until a clinician acts. The system never writes a diagnosis (no Condition resources). Dismissals need a reason. Everything is audit-logged.", "clinician"],
      ["Validation and local population performance", "Completion, test–retest ICC, sensitivity, specificity, PPV, referrals per confirmed finding, change detection and time to assessment, by dialect, age and education. Pipeline runs now on synthetic data and later on Phase 1–2 data.", "validation"],
    ];
    $("#main").innerHTML = `<div class="two"><div class="panel pad"><h2>How MemBrain meets the six requirements</h2>${reqs.map((r, i) => `<div class="req"><div class="n">${i + 1}</div><div><b>${r[0]}</b><div class="small muted">${r[1]}</div><button class="btn small" style="margin-top:6px" data-go="${r[2]}">See it →</button></div></div>`).join("")}</div>
      <div class="grid"><div class="panel pad"><h2>Architecture</h2>${archSvg()}</div>
      <div class="panel pad"><h3>Design principles</h3><ul class="small">
        <li>Validated instruments and inspectable statistics first; machine learning second and exploratory.</li>
        <li>Explainable by construction: one engine, versioned (engine ${C.ENGINE_VERSION}, norms ${C.NORMS_VERSION}). Python and JavaScript produce identical results on 90 golden test cases.</li>
        <li>Per-signal consent; identifiers held apart from assessment data; in-country hosting; voice reduced to features on the device.</li>
        <li>Built for low-end Android, WhatsApp/phone fallback channels (scores not pooled across channels until equivalence is shown).</li>
        <li>Design controls aligned to IEC 62304 / ISO 14971. Pilot runs as research under ethics approval until EDE classification advice is received.</li></ul></div></div></div>`;
    document.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => go(b.dataset.go)));
  }
  function archSvg() {
    const box = (x, y, w, h, t, s, f = "#e2efef", c = "#0f5c63") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${f}" stroke="${c}" stroke-opacity=".35"/><text x="${x + w / 2}" y="${y + 20}" text-anchor="middle" font-size="12.5" font-weight="600" fill="${c}">${t}</text><text x="${x + w / 2}" y="${y + 37}" text-anchor="middle" font-size="10.5" fill="#5f6b6e">${s}</text>`;
    const ar = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#9aa6a8" stroke-width="1.4" marker-end="url(#a)"/>`;
    return `<svg viewBox="0 0 560 360" width="100%"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa6a8"/></marker></defs>
      ${box(10, 10, 170, 50, "Participant app", "voice-first · AR/EN · offline")}${box(195, 10, 170, 50, "Caregiver mode", "assisted, flagged")}${box(380, 10, 170, 50, "Clinician dashboard", "queue · dossier · actions")}
      ${box(10, 95, 260, 50, "Assessment + speech", "item bank · quality gate · ASR · features")}${box(290, 95, 260, 50, "Analytics", "norms · RCI · confounders · fusion")}
      ${box(10, 180, 260, 50, "Clinical workflow", "tasks · referral · messages", "#f5ead9", "#8a6328")}${box(290, 180, 260, 50, "Prevention engine", "versioned rules · AR/EN", "#f5ead9", "#8a6328")}
      ${box(10, 265, 540, 60, "Data & trust layer (in-country)", "FHIR R4 store · consent service · identity vault · OAuth2/SMART · audit log · KMS", "#eef0f6", "#4d5f8a")}
      ${ar(95, 60, 120, 95)}${ar(465, 60, 420, 95)}${ar(270, 120, 290, 120)}${ar(420, 145, 420, 180)}${ar(140, 145, 140, 180)}${ar(140, 230, 140, 265)}${ar(420, 230, 420, 265)}
      <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#5f6b6e">Connectors: wearables · questionnaires · clinical record (via partner) · later: HIE, genomics</text></svg>`;
  }

  // ---------------------------------------------------------------- boot
  const h = (location.hash || "").replace("#", ""); if (["home", "intake", "enrol", "participant", "clinician", "referrals", "validation", "how"].includes(h)) S.view = h;
  window.addEventListener("hashchange", () => { const v = (location.hash || "").replace("#", ""); if (v !== S.view && ["home", "intake", "enrol", "participant", "clinician", "referrals", "validation", "how"].includes(v)) go(v); });
  go(S.view);
  initSpeech();
})();

</script>
</body>
</html>
